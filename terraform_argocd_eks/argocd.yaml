#----------------------------------------------------------------
# Local single-node mode
redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  autoscaling:
    enabled: false
  replicas: 1
  # Fixing issue with Stuck Processing for Ingress resource
  config:
    resource.customizations: |
      networking.k8s.io/Ingress:
        health.lua: |
          hs = {}
          hs.status = "Healthy"
          return hs

repoServer:
  autoscaling:
    enabled: false
  replicas: 1

applicationSet:
  replicas: 1
  
1
